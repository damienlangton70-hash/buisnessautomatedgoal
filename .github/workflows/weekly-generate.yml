name: DarkDragonAssets

# Two schedules, each gating exactly one job.
#
# Previously there was a single daily cron and BOTH jobs carried the same
# `if` condition on it, so every day the pipeline generated assets *and*
# bundled *and* attempted to publish — in parallel, meaning the bundler
# checked out the repo before the generator had pushed that day's work.
on:
  schedule:
    - cron: "0 9 * * 1-5" # Mon-Fri 09:00 UTC — generate
    - cron: "0 10 * * 6" # Saturday 10:00 UTC — bundle + publish
  workflow_dispatch:
    inputs:
      action:
        description: "Which job to run"
        required: true
        default: generate-daily
        type: choice
        options:
          - generate-daily
          - bundle-weekly
      week_id:
        description: "ISO week to bundle (e.g. 2026-36). Blank = current week."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: darkdragon-assets
  cancel-in-progress: false

jobs:
  generate-daily:
    if: >-
      github.event.schedule == '0 9 * * 1-5' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'generate-daily')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Resolve ISO week
        id: week
        run: |
          echo "id=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Carries the week's earlier days forward, so today's themes don't repeat
      # them and Saturday can see the whole week. Nothing binary goes into git.
      - name: Restore this week's assets
        uses: actions/cache/restore@v4
        with:
          path: data/daily
          key: dda-${{ steps.week.outputs.id }}-${{ steps.week.outputs.date }}
          restore-keys: |
            dda-${{ steps.week.outputs.id }}-

      - name: Generate tilesets
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAGE_QUALITY: ${{ vars.IMAGE_QUALITY || 'hd' }}
          TILESETS_PER_RUN: ${{ vars.TILESETS_PER_RUN || '5' }}
          TILE_SIZE: ${{ vars.TILE_SIZE || '512' }}
        run: npm run generate:daily

      - name: Save this week's assets
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/daily
          key: dda-${{ steps.week.outputs.id }}-${{ steps.week.outputs.date }}-${{ github.run_id }}

      - name: Upload day's output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dda-${{ steps.week.outputs.id }}-${{ steps.week.outputs.date }}
          path: data/daily
          retention-days: 10

  bundle-weekly:
    if: >-
      github.event.schedule == '0 10 * * 6' ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'bundle-weekly')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: Resolve ISO week
        id: week
        run: |
          WEEK="${{ inputs.week_id }}"
          [ -z "$WEEK" ] && WEEK="$(date -u +%G-%V)"
          echo "id=$WEEK" >> "$GITHUB_OUTPUT"

      - name: Restore this week's assets
        uses: actions/cache/restore@v4
        with:
          path: data/daily
          key: dda-${{ steps.week.outputs.id }}-final
          restore-keys: |
            dda-${{ steps.week.outputs.id }}-

      - name: Bundle the week
        env:
          WEEK_ID: ${{ steps.week.outputs.id }}
        run: npm run bundle:weekly

      - name: Install butler
        run: |
          curl -sSfL -o butler.zip \
            https://broth.itch.ovh/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d "$HOME/.butler"
          chmod +x "$HOME/.butler/butler"
          echo "$HOME/.butler" >> "$GITHUB_PATH"

      - name: Publish to itch.io
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          ITCHIO_USERNAME: ${{ secrets.ITCHIO_USERNAME }}
          ITCHIO_GAME_SLUG: ${{ secrets.ITCHIO_GAME_SLUG }}
          WEEK_ID: ${{ steps.week.outputs.id }}
        run: npm run publish:weekly

      - name: Upload the pack
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darkdragon-pack-${{ steps.week.outputs.id }}
          path: dist/
          retention-days: 30
